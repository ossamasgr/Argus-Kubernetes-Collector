argus:
  # Full project/connection endpoint supplied by Argus. HTTPS is mandatory.
  endpoint: ""
watchNamespaces: []
# Optional private DNS overrides for the Argus origin; certificate verification remains enabled.
hostAliases: []
credentials:
  # Pre-created Secret with enrollment-key and agent-key; secrets are never Helm values.
  existingSecret: ""
  # Non-secret revision used to restart the collector after credential replacement.
  revision: ""
ca:
  # Optional ConfigMap containing ca.crt, for a private Argus CA.
  existingConfigMap: ""
monitoring:
  # Optional operator-provisioned Secret with targets.json and any target CA/token files.
  enabled: false
  existingSecret: ""
  # Existing persistent writable claim used to prevent lease replay across pod restarts.
  stateClaim: ""
  # Explicit CIDR and TCP port pairs allowed for approved monitoring targets.
  egress: []
image:
  repository: ghcr.io/ossamasgr/argus-kubernetes-collector
  tag: "v0.1.1"
  # Release automation pins the published chart to its multi-architecture image digest.
  digest: ""
  pullPolicy: IfNotPresent
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 250m, memory: 128Mi}
networkPolicy:
  enabled: true
  apiServerPort: 6443
  platformPort: 443
