apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "argus.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argus.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-collector
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-collector
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
      annotations:
        argus.ai/credential-revision: {{ .Values.credentials.revision | quote }}
    spec:
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "argus.name" . }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: collector
          image: {{ printf "%s%s" .Values.image.repository (ternary (printf "@%s" .Values.image.digest) (printf ":%s" .Values.image.tag) (ne .Values.image.digest "")) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ARGUS_ENDPOINT
              value: {{ .Values.argus.endpoint | quote }}
            - name: ARGUS_NAMESPACES
              value: {{ .Values.watchNamespaces | toJson | quote }}
            {{- if .Values.ca.existingConfigMap }}
            - name: ARGUS_CA_FILE
              value: /etc/argus-ca/ca.crt
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: credentials
              mountPath: /credentials
              readOnly: true
            {{- if .Values.ca.existingConfigMap }}
            - name: platform-ca
              mountPath: /etc/argus-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: credentials
          secret:
            secretName: {{ .Values.credentials.existingSecret | quote }}
            items:
              - {key: enrollment-key, path: enrollment-key}
              - {key: agent-key, path: agent-key}
        {{- if .Values.ca.existingConfigMap }}
        - name: platform-ca
          configMap:
            name: {{ .Values.ca.existingConfigMap | quote }}
        {{- end }}
