apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "argus.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argus.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- range .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "argus.role" $ }}
  namespace: {{ . | quote }}
  labels:
    {{- include "argus.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, services, persistentvolumeclaims, events]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "argus.role" $ }}
  namespace: {{ . | quote }}
  labels:
    {{- include "argus.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "argus.name" $ }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "argus.role" $ }}
{{- end }}
