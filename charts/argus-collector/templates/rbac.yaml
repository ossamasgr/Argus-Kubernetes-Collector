apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "argus.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argus.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- range .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "argus.role" $ }}
  namespace: {{ . | quote }}
  labels:
    {{- include "argus.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, services, persistentvolumeclaims, events]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
  {{- if dig "securityRead" "enabled" true $.Values }}
  # Security review: how workloads are exposed, isolated and allowed to act. Never Secrets or ConfigMaps.
  - apiGroups: [""]
    resources: [serviceaccounts, resourcequotas, limitranges]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "argus.role" $ }}
  namespace: {{ . | quote }}
  labels:
    {{- include "argus.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "argus.name" $ }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "argus.role" $ }}
{{- end }}
{{- if and (dig "securityRead" "enabled" true .Values.AsMap) (dig "securityRead" "cluster" true .Values.AsMap) }}
---
# Cluster-wide permissions that can reach the watched namespaces, plus their own labels. Read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "argus.role" . }}
  labels:
    {{- include "argus.labels" . | nindent 4 }}
rules:
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames:
      {{- toYaml .Values.watchNamespaces | nindent 6 }}
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "argus.role" . }}
  labels:
    {{- include "argus.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "argus.name" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "argus.role" . }}
{{- end }}
