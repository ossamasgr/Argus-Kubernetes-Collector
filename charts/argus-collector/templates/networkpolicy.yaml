{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "argus.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argus-collector
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- if .Values.monitoring.enabled }}
    {{- range .Values.monitoring.apiServerCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: {{ $.Values.networkPolicy.apiServerPort }}}
    {{- end }}
    {{- range .Values.monitoring.platformCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - {protocol: TCP, port: {{ $.Values.networkPolicy.platformPort }}}
    {{- end }}
    {{- range .Values.monitoring.egress }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      ports:
        - {protocol: TCP, port: {{ .port }}}
    {{- end }}
    {{- else }}
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: {{ .Values.networkPolicy.apiServerPort }}}
        - {protocol: TCP, port: {{ .Values.networkPolicy.platformPort }}}
    {{- end }}
{{- end }}
